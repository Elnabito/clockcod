<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clockcod – WOD Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff2414; --red-off:#2a0705; --red-glow:rgba(255,40,20,.85);
    --green:#27ff4e; --green-off:#062009; --green-glow:rgba(40,255,80,.8);
    --amber:#ffb000;
    --dw:min(12.5vw, 24vh);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:'Share Tech Mono',ui-monospace,monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
  #app{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}

  /* Mode tabs */
  #tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;background:#111;border:1px solid #2a2a2a;color:#888;padding:10px 12px;border-radius:8px;font:inherit;font-size:14px;letter-spacing:.08em}
  .tab.active{color:#fff;border-color:var(--red);background:#1a0503;box-shadow:0 0 10px rgba(255,36,20,.35) inset}

  /* Stage */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .housing{position:relative;width:100%;max-width:1400px;background:linear-gradient(180deg,#1d1d1d,#0b0b0b);border:1px solid #333;border-radius:16px;padding:calc(var(--dw)*.18) calc(var(--dw)*.22) calc(var(--dw)*.14);box-shadow:0 10px 40px rgba(0,0,0,.8), inset 0 1px 0 #3a3a3a}
  .screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#777,#222);box-shadow:inset 0 0 2px #000}
  .screw.tl{top:8px;left:8px}.screw.tr{top:8px;right:8px}.screw.bl{bottom:8px;left:8px}.screw.br{bottom:8px;right:8px}
  .labelrow{display:flex;justify-content:space-between;align-items:baseline;color:var(--red);font-size:calc(var(--dw)*.2);letter-spacing:.15em;padding:0 4px 6px;text-shadow:0 0 8px var(--red-glow);min-height:1.4em}
  #status{color:#a33;text-shadow:none}
  .screen{background:radial-gradient(ellipse at center,#0d0101 0%,#030000 70%);border-radius:8px;border:1px solid #1a0000;box-shadow:inset 0 0 30px #000;padding:calc(var(--dw)*.14) calc(var(--dw)*.12);display:flex;align-items:center;justify-content:center;gap:calc(var(--dw)*.06);cursor:pointer}
  .digit{overflow:visible;width:var(--dw);height:calc(var(--dw)*1.62);display:block}
  .sep{overflow:visible;width:calc(var(--dw)*.32);height:calc(var(--dw)*1.62);display:block}
  .seg,.dot{fill:var(--red-off);transition:fill .05s}
  .seg.on,.dot.on{fill:var(--red);filter:drop-shadow(0 0 3px var(--red-glow)) drop-shadow(0 0 10px rgba(255,30,10,.45))}
  .screen.rest .seg,.screen.rest .dot{fill:var(--green-off)}
  .screen.rest .seg.on,.screen.rest .dot.on{fill:var(--green);filter:drop-shadow(0 0 3px var(--green-glow)) drop-shadow(0 0 10px rgba(30,255,60,.4))}
  .screen.blink .on{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{fill-opacity:.08;filter:none}}
  .brand{text-align:center;color:#555;font-size:calc(var(--dw)*.13);letter-spacing:.5em;padding-top:8px}
  #hint{color:#666;font-size:13px;text-align:center;min-height:1em}

  /* Settings */
  #settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
  .field{display:flex;align-items:center;justify-content:space-between;background:#0e0e0e;border:1px solid #222;border-radius:10px;padding:6px 8px 6px 12px;gap:8px}
  .field label{font-size:13px;color:#999}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:40px;height:40px;border-radius:8px;border:1px solid #333;background:#181818;color:#eee;font:inherit;font-size:22px}
  .stepper button:active{background:#2a0a07}
  .stepper .val{min-width:56px;text-align:center;color:var(--red);font-size:20px;text-shadow:0 0 6px var(--red-glow)}

  /* Controls */
  #controls{display:flex;gap:8px;align-items:stretch}
  .btn{font:inherit;letter-spacing:.1em;border-radius:12px;border:1px solid #333;background:#151515;color:#ddd;font-size:16px;padding:14px 10px}
  .btn:active{transform:translateY(1px)}
  #startBtn{flex:2;background:linear-gradient(180deg,#d61a0c,#8e0d04);border-color:#ff4433;color:#fff;font-size:20px}
  #startBtn.pause{background:linear-gradient(180deg,#3a3a3a,#1e1e1e);border-color:#555}
  #resetBtn,#minusBtn{flex:1}
  .icon{flex:0 0 52px;font-size:20px;padding:0}

  body.started #tabs, body.started #settings{display:none}
  body.started{--dw:min(13.2vw, 40vh)}
  body.clock #startBtn, body.clock #resetBtn, body.clock #minusBtn, body.clock #settings{display:none}
  body.clock{--dw:min(13.2vw, 40vh)}
  #minusBtn{display:none}
  body.counting #minusBtn{display:block}
  @media (orientation:landscape) and (max-height:500px){
    #app{padding:6px;gap:6px}
    .tab{padding:6px 10px}
    .btn{padding:8px}
    body.started .brand{display:none}
    body.started{--dw:min(13.2vw, 52vh)}
    body.clock{--dw:min(13.2vw, 52vh)}
    #settings{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  }

  /* ---------- Pomodoro : interface douce ---------- */
  #pomo{display:none}
  #skipBtn{display:none}
  body.pomo{
    --focus:#f3a28f; --focus-soft:rgba(243,162,143,.16);
    --break:#9ccfb2; --break-soft:rgba(156,207,178,.16);
    --accent:var(--focus); --accent-soft:var(--focus-soft);
    --rs:min(62vw, 36vh);
    background:radial-gradient(ellipse at 50% 30%,#2b2636 0%,#1b1822 60%,#141218 100%);
    color:#ebe6f2;font-family:'Quicksand',system-ui,sans-serif;
  }
  body.pomo.break{--accent:var(--break); --accent-soft:var(--break-soft)}
  body.pomo.started{--rs:min(82vw, 60vh)}
  body.pomo .housing{display:none}
  body.pomo #pomo{display:flex;position:relative;width:var(--rs);height:var(--rs);align-items:center;justify-content:center}
  #pomo .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  #pomo .track{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6}
  #pomo .prog{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s linear, stroke .8s ease;filter:drop-shadow(0 0 6px var(--accent-soft))}
  #pomo .halo{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0%,transparent 70%);transition:background .8s ease}
  #pomo .pinfo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:calc(var(--rs)*.03)}
  #pPhase{font-size:calc(var(--rs)*.075);font-weight:500;color:var(--accent);letter-spacing:.06em;transition:color .8s ease}
  #pTime{font-size:calc(var(--rs)*.23);font-weight:500;line-height:1;font-variant-numeric:tabular-nums;color:#f4f0f8}
  #pDots{display:flex;gap:calc(var(--rs)*.022);min-height:calc(var(--rs)*.035)}
  #pDots i{width:calc(var(--rs)*.032);height:calc(var(--rs)*.032);border-radius:50%;background:rgba(255,255,255,.14);transition:background .6s}
  #pDots i.done{background:var(--focus)}
  #pDots i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--focus)}
  #pomo.paused #pTime{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.35}}
  body.pomo #hint{color:#9a93a8;font-size:14px}

  body.pomo .tab{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#9a93a8;border-radius:999px}
  body.pomo .tab.active{color:#f4f0f8;background:var(--focus-soft);border-color:rgba(243,162,143,.45);box-shadow:none}
  body.pomo .field{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:18px}
  body.pomo .field label{color:#b5aec2;font-size:14px}
  body.pomo .stepper button{border-radius:50%;border:none;background:rgba(255,255,255,.07);color:#ebe6f2}
  body.pomo .stepper button:active{background:var(--focus-soft)}
  body.pomo .stepper .val{color:var(--focus);text-shadow:none;font-weight:600}
  body.pomo .btn{border-radius:999px;border:none;background:rgba(255,255,255,.07);color:#ebe6f2;letter-spacing:.04em;font-weight:500}
  body.pomo #startBtn{background:var(--accent);color:#231d2a;font-weight:600;transition:background .8s ease}
  body.pomo #startBtn.pause{background:rgba(255,255,255,.1);color:#ebe6f2}
  body.pomo.started:not(.finished) #skipBtn{display:block;flex:1}
  @media (orientation:landscape) and (max-height:500px){
    body.pomo{--rs:min(40vw, 46vh)}
    body.pomo.started{--rs:min(60vw, 72vh)}
  }
</style>
</head>
<body>
<div id="app">
  <nav id="tabs"></nav>
  <main id="stage">
    <div class="housing">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <div class="labelrow"><span id="lbl">AMRAP</span><span id="status"></span></div>
      <div class="screen" id="screen"></div>
      <div class="brand">CLOCKCOD</div>
    </div>
    <div id="pomo">
      <div class="halo"></div>
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92"/>
        <circle class="prog" id="pProg" cx="100" cy="100" r="92"/>
      </svg>
      <div class="pinfo">
        <div id="pPhase">Focus</div>
        <div id="pTime">25:00</div>
        <div id="pDots"></div>
      </div>
    </div>
  </main>
  <div id="hint"></div>
  <section id="settings"></section>
  <footer id="controls">
    <button class="btn" id="minusBtn">−1 RND</button>
    <button class="btn" id="startBtn">START</button>
    <button class="btn" id="skipBtn">PASSER ⏭</button>
    <button class="btn" id="resetBtn">RESET</button>
    <button class="btn icon" id="soundBtn" title="Son">🔊</button>
    <button class="btn icon" id="fsBtn" title="Plein écran">⛶</button>
  </footer>
</div>

<script>
(() => {
  // ---------- Modes & settings ----------
  const PREP = {k:'prep', label:'Décompte départ', min:0, max:30, step:5, def:10, unit:'s'};
  const MODES = {
    clock:   {label:'HORLOGE', fields:[]},
    fortime: {label:'FOR TIME', fields:[{k:'capS',label:'Time cap',min:0,max:5940,step:10,def:0,unit:'s',zero:'AUCUN'}, PREP]},
    amrap:   {label:'AMRAP', fields:[{k:'dur',label:'Durée',min:10,max:5940,step:10,def:720,unit:'s'}, PREP]},
    emom:    {label:'EMOM', fields:[{k:'every',label:'Toutes les',min:10,max:600,step:10,def:60,unit:'s'},{k:'rounds',label:'Rounds',min:1,max:99,step:1,def:10}, PREP]},
    tabata:  {label:'TABATA', fields:[{k:'work',label:'Travail',min:5,max:600,step:5,def:20,unit:'s'},{k:'rest',label:'Repos',min:0,max:600,step:5,def:10,unit:'s'},{k:'rounds',label:'Rounds',min:1,max:99,step:1,def:8}, PREP]},
    pomo:    {label:'POMODORO', fields:[{k:'focus',label:'Focus',min:60,max:5940,step:60,def:1500,unit:'s'},{k:'short',label:'Pause courte',min:60,max:1800,step:60,def:300,unit:'s'},{k:'long',label:'Pause longue',min:60,max:3600,step:60,def:900,unit:'s'},{k:'rounds',label:'Pomodoros',min:1,max:12,step:1,def:4}]},
  };
  const ORDER = ['clock','fortime','amrap','emom','tabata','pomo'];

  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem('clockcod')||'{}'); }catch(e){ return {}; } },
    set(v){ try{ localStorage.setItem('clockcod', JSON.stringify(v)); }catch(e){} }
  };
  const saved = store.get();
  const cfg = {};
  for (const m of ORDER){ cfg[m] = {}; for (const f of MODES[m].fields){ const v = saved.cfg && saved.cfg[m] && saved.cfg[m][f.k]; cfg[m][f.k] = (typeof v === 'number') ? v : f.def; } }

  const S = {
    mode: MODES[saved.mode] ? saved.mode : 'amrap',
    sound: saved.sound !== false,
    segs: [], started:false, running:false, finished:false,
    elapsed:0, lastTs:0, lastSeg:-1, lastBeepSec:null, rounds:0
  };
  const persist = () => store.set({mode:S.mode, cfg, sound:S.sound});

  // ---------- 7-segment display ----------
  const SEGS = {
    a:'14,4 46,4 40,12 20,12',
    b:'50,8 50,44 46,48 42,44 42,16',
    c:'50,56 50,92 42,84 42,56 46,52',
    d:'20,88 40,88 46,96 14,96',
    e:'10,56 14,52 18,56 18,84 10,92',
    f:'10,8 18,16 18,44 14,48 10,44',
    g:'18,46 42,46 46,50 42,54 18,54 14,50'
  };
  const MAP = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
  const NS = 'http://www.w3.org/2000/svg';
  const screen = document.getElementById('screen');
  const digits = [], seps = [];

  function makeDigit(){
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 60 100'); svg.setAttribute('class','digit');
    const g = document.createElementNS(NS,'g'); g.setAttribute('transform','skewX(-5) translate(5 0)');
    const parts = {};
    for (const k in SEGS){ const p = document.createElementNS(NS,'polygon'); p.setAttribute('points',SEGS[k]); p.setAttribute('class','seg'); g.appendChild(p); parts[k]=p; }
    svg.appendChild(g); screen.appendChild(svg);
    return {parts, cur:null};
  }
  function makeSep(){
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 20 100'); svg.setAttribute('class','sep');
    const dots = [32,68].map(y => { const c = document.createElementNS(NS,'circle'); c.setAttribute('cx', 10 - (y-50)*0.09); c.setAttribute('cy',y); c.setAttribute('r',5); c.setAttribute('class','dot'); svg.appendChild(c); return c; });
    screen.appendChild(svg);
    return {dots, cur:null};
  }
  // layout: [d0 d1] : [d2 d3] : [d4 d5]
  digits.push(makeDigit(), makeDigit()); seps.push(makeSep());
  digits.push(makeDigit(), makeDigit()); seps.push(makeSep());
  digits.push(makeDigit(), makeDigit());

  function setDigit(d, ch){
    if (d.cur === ch) return; d.cur = ch;
    const on = MAP[ch] || '';
    for (const k in d.parts) d.parts[k].classList.toggle('on', on.includes(k));
  }
  function setSep(s, on){ if (s.cur === on) return; s.cur = on; s.dots.forEach(c => c.classList.toggle('on', on)); }
  function show(str, sep1, sep2){ for (let i=0;i<6;i++) setDigit(digits[i], str[i]); setSep(seps[0], sep1); setSep(seps[1], sep2); }
  const p2 = n => String(n).padStart(2,'0');

  // ---------- Audio ----------
  let ac = null;
  function ensureAudio(){ try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==='suspended') ac.resume(); }catch(e){} }
  function tone(f, d, when=0, vol=0.45){
    if (!ac || !S.sound) return;
    try{
      const t0 = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+0.005);
      g.gain.setValueAtTime(vol, t0+d-0.02); g.gain.linearRampToValueAtTime(0, t0+d);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+d+0.02);
    }catch(e){}
  }
  const beepShort = () => tone(880, .18);
  const beepGo    = () => tone(1320, .7);
  const beepRest  = () => tone(620, .7);
  const beepEnd   = () => { tone(1320,.3,0); tone(1320,.3,.45); tone(1320,1.0,.9); };
  const click     = () => tone(1760, .04, 0, .25);

  // Carillons doux (Pomodoro) : sinusoïdes, attaque lente, longue extinction
  function bell(f, when=0, dur=1.8, vol=0.16){
    if (!ac || !S.sound) return;
    try{
      const t0 = ac.currentTime + when;
      for (const [mult, v] of [[1, vol], [2, vol*0.18], [3, vol*0.05]]){
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f*mult;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(v, t0+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0+dur+0.05);
      }
    }catch(e){}
  }
  const chimeFocus = () => { bell(523.25, 0); bell(659.25, .32); };                     // do → mi
  const chimeBreak = () => { bell(783.99, 0); bell(659.25, .34); bell(523.25, .68, 2.4); }; // sol → mi → do
  const chimeEnd   = () => { bell(523.25, 0); bell(659.25, .4); bell(783.99, .8); bell(1046.5, 1.2, 3); };

  // ---------- Wake lock ----------
  let wl = null;
  async function lockScreen(){ try{ if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){} }
  function unlockScreen(){ try{ wl && wl.release(); }catch(e){} wl = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && S.running) lockScreen(); });

  // ---------- Schedule ----------
  function buildSegs(){
    const c = cfg[S.mode], segs = [];
    if (c.prep > 0) segs.push({type:'prep', dur:c.prep*1000, dir:'down'});
    if (S.mode==='fortime') segs.push({type:'work', dur: c.capS>0 ? c.capS*1000 : Infinity, dir:'up'});
    if (S.mode==='amrap')   segs.push({type:'work', dur: c.dur*1000, dir:'down'});
    if (S.mode==='emom')    for (let r=1;r<=c.rounds;r++) segs.push({type:'work', dur:c.every*1000, dir:'down', round:r});
    if (S.mode==='tabata')  for (let r=1;r<=c.rounds;r++){ segs.push({type:'work', dur:c.work*1000, dir:'down', round:r}); if (c.rest>0 && r<c.rounds) segs.push({type:'rest', dur:c.rest*1000, dir:'down', round:r}); }
    if (S.mode==='pomo')    for (let r=1;r<=c.rounds;r++){
      segs.push({type:'work', dur:c.focus*1000, dir:'down', round:r});
      if (r%4===0) segs.push({type:'rest', long:true, dur:c.long*1000, dir:'down', round:r});   // pause longue tous les 4
      else if (r<c.rounds) segs.push({type:'rest', dur:c.short*1000, dir:'down', round:r});
    }
    return segs;
  }
  function viewAt(el){
    let acc = 0;
    for (let i=0;i<S.segs.length;i++){ const s = S.segs[i]; if (el < acc + s.dur) return {i, s, t: el-acc}; acc += s.dur; }
    const i = S.segs.length-1; return {i, s:S.segs[i], t:S.segs[i].dur, done:true};
  }
  const secsOf = v => v.s.dir==='down' ? Math.max(0, Math.ceil((v.s.dur - v.t)/1000 - 1e-6)) : Math.floor(v.t/1000);

  // ---------- Render ----------
  const lbl = document.getElementById('lbl'), status = document.getElementById('status'), hint = document.getElementById('hint');
  const startBtn = document.getElementById('startBtn');

  const pomoEl = document.getElementById('pomo'), pPhase = document.getElementById('pPhase'), pTime = document.getElementById('pTime');
  const pDots = document.getElementById('pDots'), pProg = document.getElementById('pProg');
  const CIRC = 2*Math.PI*92;
  pProg.style.strokeDasharray = CIRC;
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function renderPomo(){
    let v;
    if (!S.started){ const segs = buildSegs(); v = {i:0, s:segs[0], t:0}; }
    else v = viewAt(S.elapsed);
    const c = cfg.pomo, secs = secsOf(v);
    const isBreak = v.s.type==='rest' && !S.finished;
    document.body.classList.toggle('break', isBreak);
    pTime.textContent = p2(Math.min(99, Math.floor(secs/60))) + ':' + p2(secs%60);
    pPhase.textContent = S.finished ? 'Terminé, bravo 🌿' : v.s.type==='work' ? 'Focus' : v.s.long ? 'Pause longue' : 'Pause';
    const frac = S.finished ? 0 : Math.max(0, Math.min(1, (v.s.dur - v.t)/v.s.dur));
    pProg.style.strokeDashoffset = CIRC*(1-frac);
    pomoEl.classList.toggle('paused', S.started && !S.running && !S.finished);
    // pastilles : une par pomodoro (pleine = fait, cerclée = en cours)
    const r = v.s.round || 1, doneUpTo = S.finished ? c.rounds : (v.s.type==='work' ? r-1 : r);
    if (pDots.childElementCount !== c.rounds){ pDots.innerHTML = ''; for (let i=0;i<c.rounds;i++) pDots.appendChild(document.createElement('i')); }
    [...pDots.children].forEach((d,i) => { d.classList.toggle('done', i<doneUpTo); d.classList.toggle('cur', S.started && !S.finished && v.s.type==='work' && i===r-1); });
    hint.textContent = !S.started ? `Pause longue après chaque série de 4 · ${c.rounds} pomodoro${c.rounds>1?'s':''}` : (S.started && !S.running && !S.finished) ? 'En pause' : '';
    startBtn.textContent = !S.started ? 'COMMENCER' : S.finished ? 'NOUVEAU' : S.running ? 'PAUSE' : 'REPRENDRE';
    startBtn.classList.toggle('pause', S.started && S.running);
  }

  function render(){
    const pomo = S.mode==='pomo';
    document.body.classList.toggle('pomo', pomo);
    document.body.classList.toggle('finished', S.finished);
    if (themeMeta) themeMeta.content = pomo ? '#1b1822' : '#000000';
    document.body.classList.toggle('clock', S.mode==='clock');
    document.body.classList.toggle('started', S.started);
    if (pomo){ document.body.classList.remove('counting'); renderPomo(); return; }
    document.body.classList.remove('break');
    document.body.classList.toggle('counting', S.started && (S.mode==='amrap' || S.mode==='fortime'));
    if (S.mode==='clock'){
      const d = new Date();
      show(p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds()), true, true);
      screen.classList.remove('rest','blink');
      lbl.textContent = 'HORLOGE'; status.textContent = ''; hint.textContent = '';
      return;
    }
    let v;
    if (!S.started){ const segs = buildSegs(); const i = segs.findIndex(s => s.type!=='prep'); v = {i, s:segs[i], t:0}; }
    else v = viewAt(S.elapsed);
    const secs = secsOf(v);
    const mm = Math.min(99, Math.floor(secs/60)), ss = secs%60;
    let left = '  ';
    if (v.s.type!=='prep'){
      if (v.s.round) left = p2(v.s.round);
      else if (S.rounds > 0) left = p2(Math.min(99,S.rounds));
    }
    show(left + p2(mm) + p2(ss), false, true);
    screen.classList.toggle('rest', v.s.type==='rest');
    screen.classList.toggle('blink', S.finished || (S.started && !S.running));

    const c = cfg[S.mode];
    let l = MODES[S.mode].label;
    if (v.s.type==='prep') l = 'PRÊT ?';
    else if (S.mode==='tabata') l = v.s.type==='rest' ? 'TABATA · REPOS' : 'TABATA · GO';
    else if (S.mode==='emom') l = 'EMOM';
    lbl.textContent = l;
    status.textContent = S.finished ? 'FIN' : (S.started && !S.running) ? 'PAUSE' : v.s.type==='prep' ? ''
      : (S.mode==='emom' || S.mode==='tabata') ? `${v.s.round||0}/${c.rounds}` : (S.mode==='fortime' && c.capS>0) ? `CAP ${Math.floor(c.capS/60)}:${p2(c.capS%60)}` : '';
    hint.textContent = (S.started && S.running && (S.mode==='amrap'||S.mode==='fortime')) ? 'Touchez l’afficheur pour compter un round' : '';
    startBtn.textContent = !S.started ? 'START' : S.finished ? 'NOUVEAU' : S.running ? (S.mode==='fortime' ? 'STOP' : 'PAUSE') : 'REPRENDRE';
    startBtn.classList.toggle('pause', S.started && S.running);
  }

  // ---------- Loop ----------
  function tick(){
    if (S.running){
      const now = performance.now(); S.elapsed += now - S.lastTs; S.lastTs = now;
      const v = viewAt(S.elapsed);
      if (v.done){ finish(); }
      else {
        if (v.i !== S.lastSeg){
          S.lastSeg = v.i; S.lastBeepSec = null;
          if (S.mode==='pomo'){ if (v.s.type==='work') chimeFocus(); else chimeBreak(); }
          else if (v.s.type==='work') beepGo(); else if (v.s.type==='rest') beepRest();
        }
        if (v.s.dir==='down' && S.mode!=='pomo'){
          const secs = secsOf(v);
          if (secs>=1 && secs<=3 && S.lastBeepSec!==secs && (v.s.dur - v.t) < secs*1000){ S.lastBeepSec = secs; beepShort(); }
        }
      }
    }
    render();
  }
  setInterval(tick, 100);

  function finish(){
    const total = S.segs.reduce((a,s)=>a+s.dur,0);
    if (isFinite(total)) S.elapsed = total;
    S.running = false; S.finished = true; (S.mode==='pomo' ? chimeEnd : beepEnd)(); unlockScreen();
  }
  function reset(){ S.started=false; S.running=false; S.finished=false; S.elapsed=0; S.lastSeg=-1; S.lastBeepSec=null; S.rounds=0; unlockScreen(); render(); }

  // ---------- Controls ----------
  startBtn.addEventListener('click', () => {
    ensureAudio();
    if (S.finished){ reset(); return; }
    if (!S.started){
      S.segs = buildSegs(); S.started = true; S.elapsed = 0; S.lastSeg = -1; S.rounds = 0;
      S.running = true; S.lastTs = performance.now(); lockScreen();
    } else if (S.running){
      S.running = false; unlockScreen();
    } else {
      S.running = true; S.lastTs = performance.now(); lockScreen();
    }
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', reset);
  // Pomodoro : passer directement à la phase suivante
  document.getElementById('skipBtn').addEventListener('click', () => {
    if (!S.started || S.finished) return;
    ensureAudio();
    const v = viewAt(S.elapsed);
    let acc = 0; for (let i=0;i<=v.i;i++) acc += S.segs[i].dur;
    S.elapsed = acc; S.lastTs = performance.now();
    if (v.i >= S.segs.length-1) finish();
    else if (!S.running){ S.running = true; lockScreen(); }
    tick();
  });
  document.getElementById('minusBtn').addEventListener('click', () => { if (S.rounds>0){ S.rounds--; click(); render(); } });
  screen.addEventListener('click', () => {
    ensureAudio();
    if (S.started && S.running && (S.mode==='amrap'||S.mode==='fortime')){
      const v = viewAt(S.elapsed);
      if (v.s.type!=='prep'){ S.rounds++; click(); render(); }
    }
  });
  const soundBtn = document.getElementById('soundBtn');
  const paintSound = () => soundBtn.textContent = S.sound ? '🔊' : '🔇';
  soundBtn.addEventListener('click', () => { S.sound = !S.sound; ensureAudio(); paintSound(); persist(); if (S.sound) click(); });
  paintSound();
  document.getElementById('fsBtn').addEventListener('click', async () => {
    try{
      if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }
      else await document.exitFullscreen();
    }catch(e){}
  });

  // ---------- Tabs & settings UI ----------
  const tabs = document.getElementById('tabs'), settings = document.getElementById('settings');
  function fmtVal(f, v){ if (v===0 && f.zero) return f.zero; if (f.unit==='s'){ return v>=60 ? `${Math.floor(v/60)}:${p2(v%60)}` : `${v}s`; } return String(v); }
  function buildTabs(){
    tabs.innerHTML = '';
    for (const m of ORDER){
      const b = document.createElement('button'); b.className = 'tab' + (m===S.mode?' active':''); b.textContent = MODES[m].label;
      b.addEventListener('click', () => { if (S.started) return; S.mode = m; persist(); buildTabs(); buildSettings(); reset(); });
      tabs.appendChild(b);
    }
  }
  function buildSettings(){
    settings.innerHTML = '';
    for (const f of MODES[S.mode].fields){
      const row = document.createElement('div'); row.className='field';
      row.innerHTML = `<label>${f.label}</label><div class="stepper"><button aria-label="moins">−</button><span class="val"></span><button aria-label="plus">+</button></div>`;
      const [minus, plus] = row.querySelectorAll('button'), val = row.querySelector('.val');
      const paint = () => val.textContent = fmtVal(f, cfg[S.mode][f.k]);
      const change = d => { const n = Math.min(f.max, Math.max(f.min, Math.round((cfg[S.mode][f.k] + d*f.step)/f.step)*f.step)); cfg[S.mode][f.k] = n; paint(); persist(); render(); };
      let rep;
      const hold = (d) => { change(d); let delay = 400; const go = () => { rep = setTimeout(() => { change(d); delay = Math.max(60, delay*0.75); go(); }, delay); }; go(); };
      const stop = () => clearTimeout(rep);
      for (const [btn,d] of [[minus,-1],[plus,1]]){
        btn.addEventListener('pointerdown', e => { e.preventDefault(); hold(d); });
        ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
      }
      paint(); settings.appendChild(row);
    }
  }
  buildTabs(); buildSettings(); render();
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
